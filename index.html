<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mochi Nav</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0b12;color:#eee;font:15px system-ui,sans-serif;padding-bottom:30px}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;background:#0b0b12;z-index:5}
header b{font-size:18px;flex:1}
.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#2a2a3d;color:#9aa}
.pill.on{background:#0e5f3f;color:#7dffc0}
button{font:inherit;padding:10px 12px;border:0;border-radius:10px;background:#2d2d45;color:#fff}
button.go,#cbtn{background:#6c5ce7}
#mapwrap{position:relative;margin:0 10px;border-radius:14px;overflow:hidden;height:56vh;min-height:320px;background:#e8e4d8}
#map{width:100%;height:100%;display:block;touch-action:none}
#fab{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:42px;height:42px;padding:0;font-size:20px;background:#fff;color:#222;box-shadow:0 1px 4px #0006}
#hint{position:absolute;left:8px;bottom:6px;font-size:11px;background:#fffc;color:#333;padding:3px 7px;border-radius:8px}
.card{background:#151522;border-radius:14px;padding:12px;margin:10px}
.card h3{margin:0 0 8px;font-size:15px;color:#a29bfe}
.r{display:flex;gap:8px;margin:8px 0}.r>*{flex:1}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:0;background:#242438;color:#fff}
small{color:#8a8aa5}
#addr{font-size:16px;line-height:1.35}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #23233a}
.item div{flex:1;font-size:13px}.item button{padding:6px 9px;font-size:13px}
#warn{display:none;background:#4a2430;border-radius:12px;padding:10px;margin:10px;font-size:13px}
pre{margin:10px;white-space:pre-wrap;color:#7d8;font-size:11px;max-height:110px;overflow:hidden}
</style></head><body>
<header><b>Mochi Nav</b><span id="bt" class="pill">BT: putus</span><button id="cbtn" onclick="connectBle()">Sambung</button></header>
<div id="warn"></div>
<div id="mapwrap"><canvas id="map"></canvas>
<div id="fab"><button onclick="zoom(1)">＋</button><button onclick="zoom(-1)">－</button><button onclick="followMe()">◎</button></div>
<div id="hint">tahan peta = pilih tujuan</div></div>

<div class="card"><h3>Lokasimu</h3>
<div id="addr">Menunggu GPS…</div><small id="coord"></small>
<div class="r"><button onclick="savePlace()">⭐ Simpan tempat ini</button><button onclick="sendNow()">Kirim ke Mochi</button></div></div>

<div class="card"><h3>Tujuan</h3>
<div class="r"><input id="q" placeholder="Cari tujuan (butuh internet)"><button style="flex:0 0 74px" onclick="find()">Cari</button></div>
<div id="res"></div>
<div class="r"><button class="go" onclick="go()">▶ Mulai navigasi</button><button onclick="stop()">■ Stop</button></div>
<div id="ni">-</div></div>

<div class="card"><h3>Tempat tersimpan</h3><div id="places"></div></div>
<div class="card"><h3>Riwayat lokasi</h3><div id="hist"></div><div class="r"><button onclick="clearHist()">Hapus riwayat</button></div></div>
<pre id="log"></pre>

<script>
const $=s=>document.querySelector(s);
const log=t=>{const l=$('#log');l.textContent=(new Date().toLocaleTimeString()+' '+t+'\n'+l.textContent).slice(0,1500)};
const ascii=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\|/g,'/').replace(/[^\x20-\x7e]/g,'');
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXU='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXU='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const rad=Math.PI/180;

/* ================= BLUETOOTH ================= */
let dev=null,chr=null,queue=[],pumping=false,manualDisc=false;
function setBle(on){const b=$('#bt');b.textContent=on?'BT: terhubung':'BT: putus';b.className='pill'+(on?' on':'');$('#cbtn').textContent=on?'Putus':'Sambung'}
async function link(){
  const sv=await dev.gatt.connect(),s=await sv.getPrimaryService(NUS);
  chr=await s.getCharacteristic(RXU);
  try{const tx=await s.getCharacteristic(TXU);await tx.startNotifications();
    tx.addEventListener('characteristicvaluechanged',e=>log('Mochi: '+new TextDecoder().decode(e.target.value).trim()))}catch(e){}
  setBle(true);manualDisc=false;log('Terhubung ke Mochi');
  send('T|'+Math.floor(Date.now()/1000)+'|'+(-new Date().getTimezoneOffset()));
  lastLoc=0;lastPlace='';sendNow();
}
async function connectBle(){
  if(dev&&dev.gatt.connected){manualDisc=true;dev.gatt.disconnect();return}
  if(!navigator.bluetooth){alert('Browser ini tidak mendukung Web Bluetooth. Pakai Chrome di Android (bukan iPhone/Firefox).');return}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]},{namePrefix:'MOCHI'}],optionalServices:[NUS]});
    dev.addEventListener('gattserverdisconnected',()=>{setBle(false);chr=null;log('Bluetooth putus');if(!manualDisc)setTimeout(retry,2500)});
    await link();
  }catch(e){log('BT: '+e.message)}
}
async function retry(){if(!dev||dev.gatt.connected||manualDisc)return;try{await link()}catch(e){setTimeout(retry,4000)}}
function send(line){if(!chr)return;if(queue.length>8)queue.shift();queue.push(line+'\n');pump()}
async function pump(){
  if(pumping||!chr)return;pumping=true;
  try{while(queue.length&&chr){const b=new TextEncoder().encode(queue.shift());
    for(let i=0;i<b.length;i+=20){const c=b.slice(i,i+20);await(chr.writeValueWithResponse?chr.writeValueWithResponse(c):chr.writeValue(c))}}}
  catch(e){log('kirim gagal: '+e.message)}
  pumping=false;
}

/* ================= PETA ================= */
const cv=$('#map'),X=cv.getContext('2d');
let Z=16,cen={lat:-6.2,lon:106.8},me=null,dst=null,route=null,steps=[],si=0,navOn=false,total=1,dur=1,tiles={},pend=0,followOn=true,lastRt=0,lastSend=0,arriveT=null;
const px=(lo,z)=>(lo+180)/360*256*2**z;
const py=(la,z)=>(1-Math.log(Math.tan(la*rad)+1/Math.cos(la*rad))/Math.PI)/2*256*2**z;
function W(){return cv.clientWidth}function H(){return cv.clientHeight}
const sc=(la,lo)=>[px(lo,Z)-px(cen.lon,Z)+W()/2,py(la,Z)-py(cen.lat,Z)+H()/2];
function inv(x,y){const s=256*2**Z,n=Math.PI*(1-2*(py(cen.lat,Z)+y-H()/2)/s);return{lat:Math.atan(Math.sinh(n))/rad,lon:(px(cen.lon,Z)+x-W()/2)/s*360-180}}
function hav(a,b){const R=6371000,dl=(b.lat-a.lat)*rad,dn=(b.lon-a.lon)*rad,x=Math.sin(dl/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function draw(){if(!pend){pend=1;requestAnimationFrame(_draw)}}
function _draw(){
  pend=0;const dpr=Math.min(window.devicePixelRatio||1,3),w=W(),h=H();
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#e8e4d8';X.fillRect(0,0,w,h);
  const up=dpr>=1.5?1:0,Zt=Math.min(19,Z+up),s=2**(Zt-Z),n=2**Zt,cx=px(cen.lon,Zt),cy=py(cen.lat,Zt),ts=256/s;
  const x0=Math.floor((cx-w/2*s)/256),x1=Math.floor((cx+w/2*s)/256),y0=Math.floor((cy-h/2*s)/256),y1=Math.floor((cy+h/2*s)/256);
  if(Object.keys(tiles).length>260)tiles={};
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    if(y<0||y>=n)continue;const k=Zt+'/'+(((x%n)+n)%n)+'/'+y,ox=(x*256-cx)/s+w/2,oy=(y*256-cy)/s+h/2;let im=tiles[k];
    if(!im){im=tiles[k]=new Image();im.onload=draw;im.src='https://tile.openstreetmap.org/'+k+'.png'}
    if(im.complete&&im.naturalWidth)X.drawImage(im,ox,oy,ts+0.6,ts+0.6);
  }
  if(route){X.lineJoin=X.lineCap='round';
    X.beginPath();route.forEach((p,i)=>{const q=sc(p[1],p[0]);i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1])});
    X.lineWidth=11;X.strokeStyle='#fff';X.stroke();X.lineWidth=7;X.strokeStyle='#2563eb';X.stroke()}
  if(dst){const q=sc(dst.lat,dst.lon);X.fillStyle='#e11d48';X.beginPath();X.arc(q[0],q[1]-10,9,0,7);X.fill();
    X.beginPath();X.moveTo(q[0]-6,q[1]-6);X.lineTo(q[0]+6,q[1]-6);X.lineTo(q[0],q[1]+4);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(q[0],q[1]-10,3.5,0,7);X.fill()}
  if(me){const q=sc(me.lat,me.lon),mpp=156543.03*Math.cos(me.lat*rad)/2**Z,r=Math.max(10,me.acc/mpp);
    X.fillStyle='#2563eb22';X.strokeStyle='#2563eb55';X.lineWidth=1;X.beginPath();X.arc(q[0],q[1],r,0,7);X.fill();X.stroke();
    X.save();X.translate(q[0],q[1]);if(me.h!=null&&!isNaN(me.h)&&me.spd>2){X.rotate(me.h*rad);
      X.fillStyle='#fff';X.beginPath();X.arc(0,0,12,0,7);X.fill();X.fillStyle='#2563eb';X.beginPath();X.moveTo(0,-9);X.lineTo(7,7);X.lineTo(0,3);X.lineTo(-7,7);X.fill()}
    else{X.fillStyle='#fff';X.beginPath();X.arc(0,0,11,0,7);X.fill();X.fillStyle='#2563eb';X.beginPath();X.arc(0,0,7.5,0,7);X.fill()}
    X.restore()}
}
function zoom(d){Z=Math.max(3,Math.min(19,Z+d));draw()}
function followMe(){followOn=true;if(me)cen={lat:me.lat,lon:me.lon};draw()}
let drag=null,holdT=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,m:0,sx:e.clientX,sy:e.clientY};
  holdT=setTimeout(()=>{if(drag&&!drag.m){const r=cv.getBoundingClientRect();setDst(inv(e.clientX-r.left,e.clientY-r.top),'Titik di peta');if(navigator.vibrate)navigator.vibrate(40);drag=null}},550)};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6){drag.m=1;clearTimeout(holdT)}
  if(drag.m){cen=inv(W()/2-dx,H()/2-dy);drag.x=e.clientX;drag.y=e.clientY;followOn=false;draw()}};
cv.onpointerup=cv.onpointercancel=()=>{clearTimeout(holdT);drag=null};
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1:-1)},{passive:false});
window.addEventListener('resize',draw);

/* ================= GPS, ALAMAT, RIWAYAT ================= */
let lastGeo=null,lastGeoT=0,lastLoc=0,lastPlace='',addrName='',centered=false;
function startGps(){
  if(!window.isSecureContext){$('#warn').style.display='block';$('#warn').textContent='Halaman ini tidak aman (bukan https). Browser akan menolak GPS & Bluetooth. Buka lewat alamat https:// (mis. GitHub Pages).'}
  if(!navigator.geolocation){$('#addr').textContent='GPS tidak didukung browser ini';return}
  navigator.geolocation.watchPosition(onPos,e=>{$('#addr').textContent='GPS: '+e.message+' — izinkan lokasi untuk situs ini & aktifkan GPS HP'},{enableHighAccuracy:true,maximumAge:1000,timeout:25000});
}
function onPos(p){
  const c=p.coords;me={lat:c.latitude,lon:c.longitude,acc:c.accuracy,spd:(c.speed||0)*3.6,h:c.heading};
  if(followOn||!centered){cen={lat:me.lat,lon:me.lon};centered=true}
  $('#coord').textContent=me.lat.toFixed(5)+', '+me.lon.toFixed(5)+'  ±'+Math.round(me.acc)+' m  '+Math.round(me.spd)+' km/j';
  geo();sendLoc();tick();draw();
}
function sendLoc(){if(!me)return;const n=Date.now();if(n-lastLoc<4000)return;lastLoc=n;send('L|'+me.lat.toFixed(5)+'|'+me.lon.toFixed(5)+'|'+Math.round(me.acc)+'|'+Math.round(me.spd))}
function sendNow(){lastLoc=0;sendLoc();if(addrName)send('P|'+ascii(addrName).slice(0,90))}
async function geo(){
  const n=Date.now();if(n-lastGeoT<8000)return;if(lastGeo&&n-lastGeoT<30000&&hav(me,lastGeo)<60)return;
  lastGeoT=n;lastGeo={lat:me.lat,lon:me.lon};
  try{
    const j=await(await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=id&lat='+me.lat+'&lon='+me.lon)).json(),a=j.address||{};
    const parts=[a.road||a.pedestrian||a.footway||a.path,a.neighbourhood||a.suburb||a.village,a.city_district||a.town||a.county,a.city||a.regency||a.municipality,a.state].filter(Boolean);
    addrName=parts.slice(0,4).join(', ')||(j.display_name||'').split(',').slice(0,3).join(',');
    $('#addr').textContent=addrName||'Alamat tidak ditemukan';
    if(addrName){if(ascii(addrName)!==lastPlace){lastPlace=ascii(addrName);send('P|'+lastPlace.slice(0,90))}addHist(addrName)}
  }catch(e){log('alamat gagal (butuh internet)')}
}
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
function addHist(n){const h=LS('mh',[]);if(h.length&&h[0].n===n&&Date.now()-h[0].t<300000)return;
  h.unshift({t:Date.now(),lat:me.lat,lon:me.lon,n});localStorage.setItem('mh',JSON.stringify(h.slice(0,60)));renderHist()}
function renderHist(){const h=LS('mh',[]).slice(0,12);$('#hist').innerHTML=h.length?h.map((x,i)=>'<div class="item"><div><b>'+x.n+'</b><br><small>'+new Date(x.t).toLocaleString('id-ID')+' · '+x.lat.toFixed(4)+', '+x.lon.toFixed(4)+'</small></div><button onclick="goHist('+i+')">Peta</button></div>').join(''):'<small>Belum ada.</small>'}
function goHist(i){const x=LS('mh',[])[i];if(!x)return;followOn=false;cen={lat:x.lat,lon:x.lon};Z=17;draw()}
function clearHist(){localStorage.removeItem('mh');renderHist()}
function savePlace(){if(!me){alert('Lokasi belum ada');return}const n=prompt('Nama tempat (mis. Rumah, Kantor):',(addrName||'').split(',')[0]);if(!n)return;
  const p=LS('mp',[]);p.push({n,lat:me.lat,lon:me.lon});localStorage.setItem('mp',JSON.stringify(p));renderPlaces()}
function renderPlaces(){const p=LS('mp',[]);$('#places').innerHTML=p.length?p.map((x,i)=>'<div class="item"><div><b>'+x.n+'</b><br><small>'+x.lat.toFixed(4)+', '+x.lon.toFixed(4)+'</small></div><button onclick="goPlace('+i+')">Tujuan</button><button onclick="delPlace('+i+')">✕</button></div>').join(''):'<small>Belum ada. Tekan “Simpan tempat ini”.</small>'}
function goPlace(i){const x=LS('mp',[])[i];if(x)setDst({lat:x.lat,lon:x.lon},x.n)}
function delPlace(i){const p=LS('mp',[]);p.splice(i,1);localStorage.setItem('mp',JSON.stringify(p));renderPlaces()}

/* ================= TUJUAN & NAVIGASI ================= */
function setDst(p,name){dst={lat:p.lat,lon:p.lon};followOn=false;cen={lat:p.lat,lon:p.lon};$('#ni').textContent='Tujuan: '+name;draw()}
async function find(){
  const s=$('#q').value.trim();if(!s)return;$('#res').innerHTML='<small>Mencari…</small>';
  try{
    const v=me?'&viewbox='+(me.lon-.6)+','+(me.lat+.6)+','+(me.lon+.6)+','+(me.lat-.6):'';
    const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=id&q='+encodeURIComponent(s)+v)).json();
    window._res=j;$('#res').innerHTML=j.length?j.map((x,i)=>'<div class="item"><div>'+x.display_name.slice(0,90)+'</div><button onclick="pick('+i+')">Pilih</button></div>').join(''):'<small>Tidak ketemu.</small>'
  }catch(e){$('#res').innerHTML='<small>Butuh internet untuk mencari.</small>'}
}
function pick(i){const x=window._res[i];setDst({lat:+x.lat,lon:+x.lon},x.display_name.slice(0,60));$('#res').innerHTML=''}
async function doRoute(){
  if(!me||!dst){$('#ni').textContent='Butuh lokasi & tujuan';return false}
  try{
    const j=await(await fetch('https://router.project-osrm.org/route/v1/driving/'+me.lon+','+me.lat+';'+dst.lon+','+dst.lat+'?overview=full&geometries=geojson&steps=true')).json(),r=j.routes[0];
    route=r.geometry.coordinates;steps=r.legs[0].steps;si=0;total=r.distance||1;dur=r.duration||1;lastRt=Date.now();
    $('#ni').textContent=(total/1000).toFixed(1)+' km · '+Math.round(dur/60)+' menit';
    const xs=route.map(p=>p[0]),ys=route.map(p=>p[1]);cen={lat:(Math.min(...ys)+Math.max(...ys))/2,lon:(Math.min(...xs)+Math.max(...xs))/2};
    for(Z=17;Z>3;Z--){const a=sc(Math.max(...ys),Math.min(...xs)),b=sc(Math.min(...ys),Math.max(...xs));if(a[0]>20&&a[1]>20&&b[0]<W()-20&&b[1]<H()-20)break}
    draw();return true;
  }catch(e){$('#ni').textContent='Gagal ambil rute (butuh internet)';route=null;return false}
}
async function go(){navOn=false;if(await doRoute()){navOn=true;followOn=true;if(me)cen={lat:me.lat,lon:me.lon};Z=17;draw();tick()}}
function stop(){navOn=false;route=null;steps=[];send('X');draw();$('#ni').textContent='Navigasi dihentikan'}
const LL=s=>({lat:s.maneuver.location[1],lon:s.maneuver.location[0]});
function kind(s){const m=s.maneuver,t=m.type,d=m.modifier||'';if(t==='arrive')return'arrive';if(/roundabout|rotary/.test(t))return'round';if(d==='uturn')return'uturn';
  return({'left':'left','slight left':'sleft','sharp left':'hleft','right':'right','slight right':'sright','sharp right':'hright'})[d]||'straight'}
function offRoute(){let m=1e9;for(let i=0;i<route.length;i+=3)m=Math.min(m,hav(me,{lat:route[i][1],lon:route[i][0]}));return m}
function tick(){
  if(!navOn||!me||steps.length<2)return;
  while(si<steps.length-2&&hav(me,LL(steps[si+1]))<25)si++;
  const nx=steps[si+1],d=Math.round(hav(me,LL(nx)));let rem=d;for(let j=si+1;j<steps.length;j++)rem+=steps[j].distance;
  if(Date.now()-lastRt>15000&&offRoute()>80){lastRt=Date.now();log('keluar rute, hitung ulang');doRoute();return}
  if(Date.now()-lastSend>1200){lastSend=Date.now();const k=kind(nx);
    send('N|'+k+'|'+d+'|'+Math.round(rem)+'|'+Math.round(rem*dur/total/60)+'|'+ascii(nx.name||'').slice(0,34));
    $('#ni').textContent=(k==='arrive'?'Tiba di tujuan':k)+' · '+d+' m · sisa '+(rem/1000).toFixed(1)+' km';
    if(k==='arrive'&&d<20&&!arriveT)arriveT=setTimeout(()=>{arriveT=null;stop()},10000)}
}
setInterval(tick,1500);

/* ================= MULAI ================= */
renderHist();renderPlaces();startGps();draw();
</script>
</body></html>
