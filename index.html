<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0b12"><title>Mochi Nav</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--card2:#1e1e30;--ac:#7c6cf0;--tx:#eef;--mut:#8f8fae;--ok:#33d49a;--bad:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px system-ui,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tiles{background:#e8e4d8}#tiles.night{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.8);background:#1d1d1d}
button{font:inherit;color:#fff;border:0;border-radius:12px;background:var(--card2);padding:10px 14px}
button:active{transform:scale(.97)}
.btn.go{background:var(--ac)}.btn.red{background:var(--bad)}
#top{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:8px;background:#0e0e1af0;backdrop-filter:blur(10px);border-radius:18px;padding:8px 10px;box-shadow:0 4px 18px #0008}
.bar b{font-size:17px;flex:1}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:#2a2a40;color:var(--mut);white-space:nowrap}
.pill.on{background:#0d5a3c;color:#8dffc8}
#cbtn{background:var(--ac);padding:8px 14px}#cbtn.pulse{animation:pl 1s 3}
@keyframes pl{50%{box-shadow:0 0 0 8px #7c6cf055}}
#face{width:42px;height:28px}#face rect{fill:#fff;transition:all .35s;transform-box:fill-box;transform-origin:center}
#face.on rect{animation:bl 4s infinite}#face.off rect{height:3px;y:14px}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#searchbar input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;outline:0;padding:6px 4px}
.ib{padding:8px 12px;background:var(--card2)}
#res{background:#0e0e1afa;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #0008;max-height:40vh;overflow-y:auto}
#res div{padding:12px 14px;border-top:1px solid #23233a;font-size:14px}#res div:first-child{border-top:0}#res small{color:var(--mut);display:block;margin-top:2px}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}#chips button{white-space:nowrap;background:#0e0e1ae8;font-size:13px;padding:7px 12px;border-radius:99px}
#navcard{display:none;background:#12121ef7;border-radius:20px;padding:12px;box-shadow:0 6px 22px #000a;gap:12px;align-items:center}
#navcard.show{display:flex}#narr{width:64px;height:64px;background:#26264a;border-radius:16px;padding:8px;flex:0 0 auto}
#ndist{font-size:30px;font-weight:700;line-height:1}#nst{color:#cfd;font-size:14px;margin-top:4px}
#fab{position:absolute;right:10px;top:34%;display:flex;flex-direction:column;gap:8px;z-index:4}
#fab button{width:44px;height:44px;padding:0;border-radius:14px;background:#0e0e1af0;font-size:19px;box-shadow:0 3px 10px #0008}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#101019f7;border-radius:24px 24px 0 0;z-index:6;box-shadow:0 -6px 24px #000a;padding-bottom:env(safe-area-inset-bottom)}
#handle{width:44px;height:5px;border-radius:9px;background:#3a3a55;margin:9px auto 4px}
#peek{padding:4px 14px 12px}.row{display:flex;align-items:center;gap:12px}.row>div{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}.big{font-size:24px;font-weight:700}
#sheetbody{display:none;border-top:1px solid #23233a}#sheet.open #sheetbody{display:block}
#tabs{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto}#tabs button{background:transparent;color:var(--mut);padding:8px 12px;white-space:nowrap}
#tabs button.on{background:var(--card2);color:#fff}
#tabc{padding:10px 14px 16px;max-height:40vh;overflow-y:auto}
.item{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #23233a}.item:first-child{border-top:0}
.item div{flex:1;font-size:14px;min-width:0}.item button{padding:7px 11px;font-size:13px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.kv div{background:var(--card);border-radius:12px;padding:9px 11px}.kv small{display:block;color:var(--mut);font-size:11px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #23233a}.sw:first-child{border-top:0}
input.t{width:100%;background:var(--card2);border:0;border-radius:12px;color:#fff;font:inherit;padding:11px;margin:6px 0}
pre{white-space:pre-wrap;color:#7ddca0;font-size:11px;max-height:120px;overflow:auto;background:var(--card);border-radius:12px;padding:8px}
#toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#222238f5;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:9;max-width:88%;text-align:center;font-size:14px;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id="app">
<canvas id="tiles"></canvas><canvas id="ov"></canvas>

<div id="top">
  <div class="bar" id="head">
    <svg id="face" class="off" viewBox="0 0 42 28"><rect x="6" y="5" width="11" height="18" rx="5"/><rect x="25" y="5" width="11" height="18" rx="5"/></svg>
    <b>Mochi Nav</b><span id="bt" class="pill">BT: putus</span>
    <button id="cbtn" onclick="connectBle()">Sambung</button>
  </div>
  <div class="bar" id="searchbar"><input id="q" placeholder="Cari tujuan…" enterkeyhint="search" onkeydown="if(event.key==='Enter')find()"><button class="ib" onclick="find()">🔍</button></div>
  <div id="res" hidden></div>
  <div id="chips"></div>
  <div id="navcard"><div id="narr"></div><div style="flex:1;min-width:0"><div id="ndist">-</div><div id="nst">-</div><div class="mut" id="nmeta"></div></div></div>
</div>

<div id="fab">
  <button onclick="zoom(1)">＋</button><button onclick="zoom(-1)">－</button>
  <button onclick="followMe()" title="Lokasiku">◎</button><button onclick="toggleNight()" id="nbtn">🌙</button>
</div>

<div id="sheet">
  <div id="handle" onclick="toggleSheet()"></div>
  <div id="peek"></div>
  <div id="sheetbody"><div id="tabs"></div><div id="tabc"></div></div>
</div>
<div id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s),rad=Math.PI/180;
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},SS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ascii=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\|/g,'/').replace(/[^\x20-\x7e]/g,'');
const fmtD=m=>m>=1000?(m/1000).toFixed(m>=10000?0:1)+' km':Math.round(m)+' m';
function toast(t,ms=2800){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
let mlogs=[];function mlog(t){mlogs.unshift(new Date().toLocaleTimeString('id-ID')+'  '+t);mlogs=mlogs.slice(0,30);if(curTab==='mochi')showTab('mochi')}

/* ================= BLUETOOTH ================= */
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXU='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXU='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let dev=null,chr=null,queue=[],pumping=false,manualDisc=false,bleOn=false;
function setBle(on){bleOn=on;const b=$('#bt');b.textContent=on?'BT: terhubung':'BT: putus';b.className='pill'+(on?' on':'');
  $('#cbtn').textContent=on?'Putus':'Sambung';$('#face').setAttribute('class',on?'on':'off');renderPeek();if(curTab==='mochi')showTab('mochi')}
async function link(){
  const sv=await dev.gatt.connect(),s=await sv.getPrimaryService(NUS);
  chr=await s.getCharacteristic(RXU);
  try{const tx=await s.getCharacteristic(TXU);await tx.startNotifications();
    tx.addEventListener('characteristicvaluechanged',e=>mlog('Mochi: '+new TextDecoder().decode(e.target.value).trim()))}catch(e){}
  manualDisc=false;setBle(true);toast('Mochi tersambung 🍡');mlog('Terhubung');
  send('T|'+Math.floor(Date.now()/1000)+'|'+(-new Date().getTimezoneOffset()));lastLoc=0;lastPlace='';sendNow();
}
async function connectBle(){
  if(dev&&dev.gatt.connected){manualDisc=true;dev.gatt.disconnect();return}
  if(!navigator.bluetooth){toast('Browser ini tidak mendukung Web Bluetooth. Pakai Chrome di Android.',4500);return}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]},{namePrefix:'MOCHI'}],optionalServices:[NUS]});
    dev.addEventListener('gattserverdisconnected',()=>{setBle(false);chr=null;mlog('Terputus');if(!manualDisc){toast('Bluetooth putus, mencoba lagi…');setTimeout(retry,2500)}});
    toast('Menyambung…');await link();
  }catch(e){if(e.name!=='NotFoundError')toast('Bluetooth: '+e.message,4000)}
}
async function retry(){if(!dev||dev.gatt.connected||manualDisc)return;try{await link()}catch(e){setTimeout(retry,4000)}}
function send(line){if(!chr)return false;if(queue.length>8)queue.shift();queue.push(line+'\n');pump();return true}
async function pump(){
  if(pumping||!chr)return;pumping=true;
  try{while(queue.length&&chr){const b=new TextEncoder().encode(queue.shift());
    for(let i=0;i<b.length;i+=20){const c=b.slice(i,i+20);await(chr.writeValueWithResponse?chr.writeValueWithResponse(c):chr.writeValue(c))}}}
  catch(e){mlog('kirim gagal: '+e.message)}
  pumping=false;
}

/* ================= PETA ================= */
const TC=$('#tiles'),OC=$('#ov'),XT=TC.getContext('2d'),XO=OC.getContext('2d');
let Z=LS('mz',16),cen=LS('mc',{lat:-6.2,lon:106.8}),me=null,dst=null,dstName='',route=null,steps=[],si=0,navOn=false,total=1,dur=1,tiles={},pend=0,followOn=true,anim=null;
let night=LS('mn','auto'),lastRt=0,lastSend=0,said=0,ns={},wake=null;
const px=(lo,z)=>(lo+180)/360*256*2**z,py=(la,z)=>(1-Math.log(Math.tan(la*rad)+1/Math.cos(la*rad))/Math.PI)/2*256*2**z;
const W=()=>innerWidth,H=()=>innerHeight;
const MY=()=>{const top=Math.max(150,H()*0.22),bot=$('#sheet').offsetHeight;return top+(H()-top-bot)/2};   // titik tengah peta (di antara bar atas dan sheet bawah)
const sc=(la,lo)=>[px(lo,Z)-px(cen.lon,Z)+W()/2,py(la,Z)-py(cen.lat,Z)+MY()];
function inv(x,y){const s=256*2**Z,n=Math.PI*(1-2*(py(cen.lat,Z)+y-MY())/s);return{lat:Math.atan(Math.sinh(n))/rad,lon:(px(cen.lon,Z)+x-W()/2)/s*360-180}}
function hav(a,b){const R=6371000,dl=(b.lat-a.lat)*rad,dn=(b.lon-a.lon)*rad,x=Math.sin(dl/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function isNight(){return night==='on'||(night==='auto'&&(new Date().getHours()>=18||new Date().getHours()<5))}
function draw(){if(!pend){pend=1;requestAnimationFrame(_draw)}}
function _draw(){
  pend=0;const dpr=Math.min(devicePixelRatio||1,3),w=W(),h=H();
  for(const c of[TC,OC])if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  TC.classList.toggle('night',isNight());$('#nbtn').textContent=night==='auto'?'🌗':(night==='on'?'🌙':'☀️');
  XT.setTransform(dpr,0,0,dpr,0,0);XO.setTransform(dpr,0,0,dpr,0,0);
  const my=MY(),up=dpr>=1.5?1:0,Zt=Math.min(19,Z+up),s=2**(Zt-Z),n=2**Zt,cx=px(cen.lon,Zt),cy=py(cen.lat,Zt),ts=256/s;
  XT.fillStyle=isNight()?'#e8e4d8':'#e8e4d8';XT.fillRect(0,0,w,h);
  const x0=Math.floor((cx-w/2*s)/256),x1=Math.floor((cx+w/2*s)/256),y0=Math.floor((cy-my*s)/256),y1=Math.floor((cy+(h-my)*s)/256);
  if(Object.keys(tiles).length>300)tiles={};
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    if(y<0||y>=n)continue;const k=Zt+'/'+(((x%n)+n)%n)+'/'+y,ox=(x*256-cx)/s+w/2,oy=(y*256-cy)/s+my;let im=tiles[k];
    if(!im){im=tiles[k]=new Image();im.onload=draw;im.src='https://tile.openstreetmap.org/'+k+'.png'}
    if(im.complete&&im.naturalWidth)XT.drawImage(im,ox,oy,ts+0.6,ts+0.6);else{XT.strokeStyle='#d8d2c0';XT.strokeRect(ox,oy,ts,ts)}
  }
  XO.clearRect(0,0,w,h);
  if(route){XO.lineJoin=XO.lineCap='round';XO.beginPath();route.forEach((p,i)=>{const q=sc(p[1],p[0]);i?XO.lineTo(q[0],q[1]):XO.moveTo(q[0],q[1])});
    XO.lineWidth=12;XO.strokeStyle='#fff';XO.stroke();XO.lineWidth=7.5;XO.strokeStyle=navOn?'#7c6cf0':'#3b82f6';XO.stroke()}
  if(dst){const q=sc(dst.lat,dst.lon);XO.fillStyle='#e11d48';XO.beginPath();XO.arc(q[0],q[1]-14,10,0,7);XO.fill();
    XO.beginPath();XO.moveTo(q[0]-7,q[1]-9);XO.lineTo(q[0]+7,q[1]-9);XO.lineTo(q[0],q[1]+1);XO.fill();XO.fillStyle='#fff';XO.beginPath();XO.arc(q[0],q[1]-14,4,0,7);XO.fill()}
  if(me){const q=sc(me.lat,me.lon),mpp=156543.03*Math.cos(me.lat*rad)/2**Z,r=Math.max(12,me.acc/mpp);
    XO.fillStyle='#3b82f622';XO.strokeStyle='#3b82f666';XO.lineWidth=1;XO.beginPath();XO.arc(q[0],q[1],r,0,7);XO.fill();XO.stroke();
    XO.save();XO.translate(q[0],q[1]);XO.shadowColor='#0006';XO.shadowBlur=6;
    if(me.h!=null&&!isNaN(me.h)&&me.spd>2){XO.rotate(me.h*rad);XO.fillStyle='#fff';XO.beginPath();XO.arc(0,0,13,0,7);XO.fill();XO.shadowBlur=0;
      XO.fillStyle='#2563eb';XO.beginPath();XO.moveTo(0,-10);XO.lineTo(8,8);XO.lineTo(0,4);XO.lineTo(-8,8);XO.fill()}
    else{XO.fillStyle='#fff';XO.beginPath();XO.arc(0,0,12,0,7);XO.fill();XO.shadowBlur=0;XO.fillStyle='#2563eb';XO.beginPath();XO.arc(0,0,8,0,7);XO.fill()}
    XO.restore()}
}
function saveView(){SS('mz',Z);SS('mc',cen)}
function zoom(d){Z=Math.max(3,Math.min(19,Z+d));saveView();draw()}
function flyTo(lat,lon,ms=500){anim={a:{...cen},b:{lat,lon},t0:performance.now(),ms};requestAnimationFrame(stepAnim)}
function stepAnim(t){if(!anim)return;const k=Math.min(1,(t-anim.t0)/anim.ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  cen={lat:anim.a.lat+(anim.b.lat-anim.a.lat)*e,lon:anim.a.lon+(anim.b.lon-anim.a.lon)*e};_draw();if(k<1)requestAnimationFrame(stepAnim);else{anim=null;saveView()}}
function followMe(){followOn=true;if(me){flyTo(me.lat,me.lon);if(Z<15)zoom(16-Z)}else toast('Menunggu lokasi GPS…')}
function toggleNight(){night=night==='auto'?'on':(night==='on'?'off':'auto');SS('mn',night);toast('Peta: '+(night==='auto'?'otomatis (malam gelap)':(night==='on'?'mode malam':'mode siang')));draw()}
const ptrs=new Map();let drag=null,holdT=null,pinch0=0;
OC.addEventListener('pointerdown',e=>{OC.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});anim=null;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);clearTimeout(holdT);drag=null;return}
  drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,m:0};
  holdT=setTimeout(()=>{if(drag&&!drag.m){setDstAt(inv(e.clientX,e.clientY));if(navigator.vibrate)navigator.vibrate(40);drag=null}},550)});
OC.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0&&d/pinch0>1.35){zoom(1);pinch0=d}else if(pinch0&&d/pinch0<0.74){zoom(-1);pinch0=d}return}
  if(!drag)return;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6){drag.m=1;clearTimeout(holdT)}
  if(drag.m){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;cen=inv(W()/2-dx,MY()-dy);drag.x=e.clientX;drag.y=e.clientY;followOn=false;draw()}});
const upH=e=>{ptrs.delete(e.pointerId);clearTimeout(holdT);if(ptrs.size<2)pinch0=0;if(drag&&drag.m)saveView();drag=null};
OC.addEventListener('pointerup',upH);OC.addEventListener('pointercancel',upH);
OC.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1:-1)},{passive:false});
addEventListener('resize',draw);

/* ================= GPS, ALAMAT, RIWAYAT ================= */
let lastGeo=null,lastGeoT=0,lastLoc=0,lastPlace='',addrName=(LS('mlast',{}).n||''),addrFull=(LS('mlast',{}).f||''),centered=false;
function startGps(){
  if(!window.isSecureContext)toast('Halaman bukan https/localhost: GPS & Bluetooth akan ditolak.',5000);
  if(!navigator.geolocation){toast('GPS tidak didukung browser ini');return}
  navigator.geolocation.watchPosition(onPos,e=>{toast('GPS: '+e.message+' — izinkan lokasi & nyalakan GPS HP',5000);renderPeek()},{enableHighAccuracy:true,maximumAge:1000,timeout:25000});
}
function onPos(p){
  const c=p.coords,first=!me;me={lat:c.latitude,lon:c.longitude,acc:c.accuracy,spd:(c.speed||0)*3.6,h:c.heading,alt:c.altitude};
  if(first){followOn=true;centered=true;flyTo(me.lat,me.lon,700);if(Z<15){Z=16}}
  else if(followOn&&!anim){cen={lat:me.lat,lon:me.lon}}
  geo();sendLoc();tick();draw();if(curTab==='loc'&&$('#sheet').classList.contains('open'))showTab('loc');
  if(dst&&!route&&first)previewRoute();
}
function sendLoc(){if(!me)return;const n=Date.now();if(n-lastLoc<4000)return;lastLoc=n;send('L|'+me.lat.toFixed(5)+'|'+me.lon.toFixed(5)+'|'+Math.round(me.acc)+'|'+Math.round(me.spd))}
function sendNow(){lastLoc=0;sendLoc();if(addrName)send('P|'+ascii(addrName).slice(0,90));toast(bleOn?'Lokasi dikirim ke Mochi':'Mochi belum tersambung')}
async function geo(){
  const n=Date.now();if(n-lastGeoT<8000)return;if(lastGeo&&n-lastGeoT<30000&&hav(me,lastGeo)<60)return;
  lastGeoT=n;lastGeo={lat:me.lat,lon:me.lon};
  try{
    const j=await(await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=id&lat='+me.lat+'&lon='+me.lon)).json(),a=j.address||{};
    const parts=[a.road||a.pedestrian||a.footway||a.path,a.neighbourhood||a.suburb||a.village,a.city_district||a.town||a.county,a.city||a.regency||a.municipality,a.state].filter(Boolean);
    addrName=parts.slice(0,4).join(', ')||(j.display_name||'').split(',').slice(0,3).join(',');addrFull=j.display_name||addrName;
    SS('mlast',{n:addrName,f:addrFull});renderPeek();
    if(addrName){if(ascii(addrName)!==lastPlace){lastPlace=ascii(addrName);send('P|'+lastPlace.slice(0,90))}addHist(addrName)}
  }catch(e){}
}
function addHist(n){const h=LS('mh',[]);if(h.length&&h[0].n===n&&Date.now()-h[0].t<300000)return;h.unshift({t:Date.now(),lat:me.lat,lon:me.lon,n});SS('mh',h.slice(0,60));if(curTab==='hist')showTab('hist')}
function savePlace(){if(!me){toast('Lokasi belum ada');return}const n=prompt('Nama tempat (mis. Rumah, Kantor):',(addrName||'').split(',')[0]);if(!n)return;
  const p=LS('mp',[]);p.push({n,lat:me.lat,lon:me.lon});SS('mp',p);renderChips();toast('Tersimpan: '+n);if(curTab==='places')showTab('places')}
function renderChips(){const p=LS('mp',[]).slice(0,5);$('#chips').innerHTML=p.map((x,i)=>'<button onclick="goPlace('+i+')">⭐ '+esc(x.n)+'</button>').join('')}
function goPlace(i){const x=LS('mp',[])[i];if(x)setDst({lat:x.lat,lon:x.lon},x.n)}

/* ================= TUJUAN & RUTE ================= */
async function find(){
  const s=$('#q').value.trim(),r=$('#res');if(!s)return;r.hidden=false;r.innerHTML='<div>Mencari…</div>';
  try{
    const v=me?'&viewbox='+(me.lon-.6)+','+(me.lat+.6)+','+(me.lon+.6)+','+(me.lat-.6):'';
    const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=id&q='+encodeURIComponent(s)+v)).json();
    window._res=j;r.innerHTML=j.length?j.map((x,i)=>'<div onclick="pick('+i+')"><b>'+esc(x.display_name.split(',')[0])+'</b><small>'+esc(x.display_name.split(',').slice(1,4).join(','))+'</small></div>').join(''):'<div>Tidak ketemu.</div>';
  }catch(e){r.innerHTML='<div>Butuh internet untuk mencari. Tahan peta untuk memilih tujuan.</div>'}
}
function pick(i){const x=window._res[i];$('#res').hidden=true;$('#q').blur();setDst({lat:+x.lat,lon:+x.lon},x.display_name.split(',').slice(0,2).join(','))}
function setDstAt(p){setDst(p,'Titik di peta')}
function setDst(p,name){dst={lat:p.lat,lon:p.lon};dstName=name;route=null;followOn=false;flyTo(p.lat,p.lon);toast('Tujuan: '+name);renderPeek();if(me)previewRoute();draw()}
function clearDst(){dst=null;route=null;steps=[];renderPeek();draw()}
async function previewRoute(){
  if(!me||!dst)return false;renderPeek();
  try{
    const j=await(await fetch('https://router.project-osrm.org/route/v1/driving/'+me.lon+','+me.lat+';'+dst.lon+','+dst.lat+'?overview=full&geometries=geojson&steps=true')).json(),r=j.routes[0];
    route=r.geometry.coordinates;steps=r.legs[0].steps;si=0;said=0;total=r.distance||1;dur=r.duration||1;lastRt=Date.now();
    const xs=route.map(p=>p[0]),ys=route.map(p=>p[1]);cen={lat:(Math.min(...ys)+Math.max(...ys))/2,lon:(Math.min(...xs)+Math.max(...xs))/2};
    for(Z=17;Z>3;Z--){const a=sc(Math.max(...ys),Math.min(...xs)),b=sc(Math.min(...ys),Math.max(...xs));if(a[0]>24&&a[1]>150&&b[0]<W()-24&&b[1]<H()-$('#sheet').offsetHeight-10)break}
    renderPeek();draw();return true;
  }catch(e){toast('Gagal ambil rute (butuh internet)');return false}
}
async function go(){
  if(!route&&!(await previewRoute()))return;
  navOn=true;followOn=true;si=0;said=0;if(me){cen={lat:me.lat,lon:me.lon};Z=17}
  $('#sheet').classList.remove('open');keepAwake(true);renderPeek();draw();tick();
  if(!bleOn){toast('Navigasi jalan di HP. Tekan “Sambung” di atas agar belokan tampil di Mochi.',4500);$('#cbtn').classList.add('pulse');setTimeout(()=>$('#cbtn').classList.remove('pulse'),3500)}
  speak('Navigasi dimulai');
}
function stop(){navOn=false;route=null;steps=[];dst=null;send('X');$('#navcard').classList.remove('show');keepAwake(false);renderPeek();draw();toast('Navigasi dihentikan')}
async function keepAwake(on){try{if(on&&'wakeLock'in navigator)wake=await navigator.wakeLock.request('screen');else if(wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(navOn&&document.visibilityState==='visible')keepAwake(true)});
const LL=s=>({lat:s.maneuver.location[1],lon:s.maneuver.location[0]});
function kind(s){const m=s.maneuver,t=m.type,d=m.modifier||'';if(t==='arrive')return'arrive';if(/roundabout|rotary/.test(t))return'round';if(d==='uturn')return'uturn';
  return({'left':'left','slight left':'sleft','sharp left':'hleft','right':'right','slight right':'sright','sharp right':'hright'})[d]||'straight'}
const KT={left:'belok kiri',right:'belok kanan',sleft:'serong ke kiri',sright:'serong ke kanan',hleft:'belok tajam ke kiri',hright:'belok tajam ke kanan',uturn:'putar balik',round:'masuk bundaran',straight:'lurus',arrive:'Anda telah tiba di tujuan'};
let voiceOn=LS('mv',true);
function speak(t){if(!voiceOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';speechSynthesis.speak(u)}catch(e){}}
function arrowSvg(c){
  const S='stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"';let b='';
  if(c==='arrive')b='<path d="M24 5a11 11 0 0 1 11 11c0 9-11 26-11 26S13 25 13 16A11 11 0 0 1 24 5z" fill="#ff5d73"/><circle cx="24" cy="16" r="4.5" fill="#fff"/>';
  else if(c==='uturn')b='<path '+S+' d="M14 44V20a10 10 0 0 1 20 0v14"/><path d="M26 32l8 12 8-12z" fill="#fff"/>';
  else if(c==='round')b='<circle cx="24" cy="26" r="10" '+S+'/><path '+S+' d="M24 46V36M32 19l8-9"/><path d="M44 4l-12 3 9 10z" fill="#fff"/>';
  else{const th={left:-90,right:90,sleft:-45,sright:45,hleft:-135,hright:135}[c]||0,a=th*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a),tx=24+dx*16,ty=30+dy*16,f=v=>v.toFixed(1);
    b='<path '+S+' d="M24 46V30L'+f(tx)+' '+f(ty)+'"/><path d="M'+f(tx+dx*10)+' '+f(ty+dy*10)+'L'+f(tx-dy*10)+' '+f(ty+dx*10)+'L'+f(tx+dy*10)+' '+f(ty-dx*10)+'Z" fill="#fff"/>'}
  return '<svg viewBox="0 0 48 48" width="100%" height="100%">'+b+'</svg>';
}
function offRoute(){let m=1e9;for(let i=0;i<route.length;i+=3)m=Math.min(m,hav(me,{lat:route[i][1],lon:route[i][0]}));return m}
function tick(){
  if(!navOn||!me||steps.length<2)return;
  while(si<steps.length-2&&hav(me,LL(steps[si+1]))<25){si++;said=0}
  const nx=steps[si+1],d=Math.round(hav(me,LL(nx))),k=kind(nx);let rem=d;for(let j=si+1;j<steps.length;j++)rem+=steps[j].distance;
  const secs=rem*dur/total;ns={k,d,rem,street:nx.name||'',eta:Math.round(secs/60),clock:new Date(Date.now()+secs*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};
  const nc=$('#navcard');nc.classList.add('show');$('#narr').innerHTML=arrowSvg(k);$('#ndist').textContent=k==='arrive'?'Tiba':fmtD(d);
  $('#nst').textContent=(KT[k]||'')+(ns.street&&k!=='arrive'?' · '+ns.street:'');$('#nmeta').textContent='Sisa '+fmtD(rem)+' · '+ns.eta+' mnt · tiba '+ns.clock+' · '+Math.round(me.spd)+' km/j';
  renderPeek();
  if(Date.now()-lastRt>15000&&offRoute()>80){lastRt=Date.now();toast('Keluar rute, menghitung ulang…');speak('Menghitung ulang rute');previewRoute().then(()=>{si=0;said=0});return}
  if(k!=='straight'&&k!=='arrive'){if(d<=250&&said<1){said=1;speak('Dalam '+(Math.round(d/10)*10)+' meter, '+KT[k]+(ns.street?' ke '+ns.street:''))}if(d<=60&&said<2){said=2;speak(KT[k])}}
  if(k==='arrive'&&d<25&&said<2){said=2;speak(KT.arrive);setTimeout(()=>{if(navOn)stop()},9000)}
  if(Date.now()-lastSend>1200){lastSend=Date.now();send('N|'+k+'|'+d+'|'+Math.round(rem)+'|'+ns.eta+'|'+ascii(ns.street).slice(0,34))}
}
setInterval(tick,1500);

/* ================= SHEET & TAB ================= */
let curTab='loc';
function renderPeek(){
  const p=$('#peek');
  if(navOn){p.innerHTML='<div class="row"><div><div class="big">'+fmtD(ns.rem||total)+'</div><div class="mut">sisa · tiba '+esc(ns.clock||'-')+'</div></div><button class="btn red" onclick="stop()">■ Berhenti</button></div>'}
  else if(dst&&route){p.innerHTML='<div class="row"><div><b>'+esc(dstName)+'</b><div class="mut">'+(total/1000).toFixed(1)+' km · '+Math.round(dur/60)+' menit</div></div><button class="btn" onclick="clearDst()">✕</button><button class="btn go" onclick="go()">▶ Mulai</button></div>'}
  else if(dst){p.innerHTML='<div class="row"><div><b>'+esc(dstName)+'</b><div class="mut">'+(me?'Menghitung rute…':'Menunggu lokasi GPS…')+'</div></div><button class="btn" onclick="clearDst()">✕</button></div>'}
  else p.innerHTML='<div class="row"><div><div class="mut">Lokasimu'+(me?' · ±'+Math.round(me.acc)+' m':'')+'</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(addrName||'Menunggu GPS…')+'</div></div><button class="btn" onclick="savePlace()">⭐</button></div>';
  draw();
}
function toggleSheet(){const s=$('#sheet');s.classList.toggle('open');if(s.classList.contains('open'))showTab(curTab);draw()}
const TABS=[['loc','Lokasi'],['places','Tersimpan'],['hist','Riwayat'],['mochi','Mochi'],['set','Pengaturan']];
function showTab(t){
  curTab=t;$('#tabs').innerHTML=TABS.map(x=>'<button class="'+(x[0]===t?'on':'')+'" onclick="showTab(\''+x[0]+'\')">'+x[1]+'</button>').join('');const c=$('#tabc');
  if(t==='loc'){
    c.innerHTML='<div>'+esc(addrFull||addrName||'Belum ada alamat')+'</div><div class="kv">'+
      '<div><small>Koordinat</small>'+(me?me.lat.toFixed(5)+', '+me.lon.toFixed(5):'-')+'</div><div><small>Akurasi</small>'+(me?'±'+Math.round(me.acc)+' m':'-')+'</div>'+
      '<div><small>Kecepatan</small>'+(me?Math.round(me.spd)+' km/j':'-')+'</div><div><small>Ketinggian</small>'+(me&&me.alt!=null?Math.round(me.alt)+' m':'-')+'</div></div>'+
      '<div class="row"><button onclick="savePlace()">⭐ Simpan tempat</button><button onclick="sendNow()">📡 Kirim ke Mochi</button><button onclick="copyLink()">🔗 Salin</button></div>'}
  else if(t==='places'){const p=LS('mp',[]);c.innerHTML=p.length?p.map((x,i)=>'<div class="item"><div><b>'+esc(x.n)+'</b><br><span class="mut">'+x.lat.toFixed(4)+', '+x.lon.toFixed(4)+'</span></div><button onclick="goPlace('+i+');toggleSheet()">Tujuan</button><button onclick="delPlace('+i+')">✕</button></div>').join(''):'<span class="mut">Belum ada. Tekan ⭐ untuk menyimpan lokasimu.</span>'}
  else if(t==='hist'){const h=LS('mh',[]).slice(0,15);c.innerHTML=(h.length?h.map((x,i)=>'<div class="item"><div><b>'+esc(x.n)+'</b><br><span class="mut">'+new Date(x.t).toLocaleString('id-ID')+'</span></div><button onclick="goHist('+i+')">Peta</button></div>').join(''):'<span class="mut">Belum ada riwayat.</span>')+'<div class="row" style="margin-top:8px"><button onclick="SS(\'mh\',[]);showTab(\'hist\')">Hapus riwayat</button></div>'}
  else if(t==='mochi'){c.innerHTML='<div class="row"><div><b>'+(bleOn?'Terhubung ke Mochi':'Belum tersambung')+'</b><div class="mut">'+(bleOn?'Lokasi, belokan & jam dikirim otomatis':'Tekan “Sambung” di bar atas')+'</div></div><button class="btn go" onclick="connectBle()">'+(bleOn?'Putus':'Sambung')+'</button></div>'+
      '<input class="t" id="msg" maxlength="100" placeholder="Kirim pesan ke layar Mochi"><div class="row"><button onclick="sendMsg()">Kirim pesan</button><button onclick="syncTime()">🕐 Sinkron jam</button></div><pre>'+esc(mlogs.join('\n')||'Belum ada aktivitas.')+'</pre>'}
  else{c.innerHTML='<div class="sw"><span>Suara petunjuk belok</span><button id="vb" onclick="toggleVoice()">'+(voiceOn?'Nyala':'Mati')+'</button></div><div class="sw"><span>Tema peta</span><button onclick="toggleNight();showTab(\'set\')">'+(night==='auto'?'Otomatis':(night==='on'?'Malam':'Siang'))+'</button></div><div class="sw"><span>Layar tetap menyala saat navigasi</span><span class="mut">otomatis</span></div><div class="mut" style="margin-top:10px">Tahan peta untuk memilih tujuan. Cubit dua jari untuk zoom.</div>'}
}
function toggleVoice(){voiceOn=!voiceOn;SS('mv',voiceOn);if(voiceOn)speak('Suara petunjuk menyala');showTab('set')}
function sendMsg(){const t=$('#msg').value.trim();if(!t)return;if(!bleOn){toast('Mochi belum tersambung');return}send('M|'+ascii(t).slice(0,100));$('#msg').value='';toast('Pesan terkirim')}
function syncTime(){if(!bleOn){toast('Mochi belum tersambung');return}send('T|'+Math.floor(Date.now()/1000)+'|'+(-new Date().getTimezoneOffset()));toast('Jam disinkronkan')}
function copyLink(){if(!me)return;const u='https://www.google.com/maps?q='+me.lat+','+me.lon;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Tautan lokasi disalin'),()=>prompt('Salin tautan:',u))}
function delPlace(i){const p=LS('mp',[]);p.splice(i,1);SS('mp',p);renderChips();showTab('places')}
function goHist(i){const x=LS('mh',[])[i];if(!x)return;followOn=false;flyTo(x.lat,x.lon);if(Z<16)Z=16;toggleSheet()}

/* ================= MULAI ================= */
renderChips();renderPeek();showTab('loc');draw();
if(!navigator.bluetooth)$('#cbtn').title='Web Bluetooth tidak didukung browser ini';
setTimeout(startGps,400);
</script>
</body></html>
